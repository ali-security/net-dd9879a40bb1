# Upstream golang.org/x/net has no GitHub Actions CI (it is tested on the Go
# project's own TryBot/LUCI infrastructure), so this workflow is written from
# scratch. It packages the module zip exactly as the module proxy does and runs
# the project's own test suite (`go test ./...`) on Linux, macOS and Windows.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Go package pattern(s) to test instead of ./...'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # Build the packaging helper in its own module OUTSIDE the checkout, so
      # `go get` never touches this repository's go.mod/go.sum.
      - name: Build module-zip helper
        run: |
          set -eux
          HELPER=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
          cd "$HELPER"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" .

      # golang.org/x/mod/zip skips .git but DESCENDS into .github, so this
      # workflow would otherwise leak into the zip as extra entries that the
      # public proxy artifact does not have. .gitignore and .gitattributes are
      # kept: they ARE part of the published module zip.
      - name: Create module zip
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/out"
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" \
            golang.org/x/net v0.45.0 \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/out/v0.45.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.45.0.zip" | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.45.0.zip
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # go.mod declares go 1.24.0. On Go 1.24 the synctest-based tests in
      # http2/ and internal/http3/ are gated on `goexperiment.synctest`;
      # without it they are compiled out (http2) or fail to compile
      # (internal/http3: files_test.go uses helpers from synctest-gated files).
      GOEXPERIMENT: synctest
    defaults:
      run:
        # Windows would otherwise default to pwsh, where `set -eux` fails.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: |
          set -eux
          go version
          go build ./...

      # -v so every test reports its own PASS/FAIL/SKIP line (a SKIP line is
      # preceded by the t.Skip reason); the summary step states how many tests
      # passed. -count=1 bypasses the test cache setup-go restores, so every
      # run really executes the suite. The exit status of `go test` is
      # propagated unchanged.
      - name: Test
        run: |
          set -euo pipefail
          go test -v -count=1 ${{ inputs.test-filter || './...' }} 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      # Per-package results, then every skipped test with the reason it gave
      # to t.Skip (the last `file_test.go:N: ...` line logged under that test's
      # `=== RUN/CONT/NAME` header), then the totals.
      - name: Test summary
        if: always()
        run: |
          set -eu
          awk '
            { sub(/\r$/, "") }
            /^=== (RUN|CONT|NAME|PAUSE)[ \t]/ { cur = $3 }
            /^[ \t]+[A-Za-z0-9_.\/-]+\.go:[0-9]+: / { r = $0; sub(/^[ \t]+/, "", r); reason[cur] = r }
            /^(ok|FAIL|\?)[ \t]/ { pkgline[++np] = $0 }
            /^ok[ \t]/ { pok++ }
            /^FAIL[ \t]/ { pfail++ }
            /^[ \t]*--- PASS/ { pass++ }
            /^[ \t]*--- FAIL/ { fail++ }
            /^[ \t]*--- SKIP/ {
              skip++
              name = $3
              why = (name in reason) ? reason[name] : "(no t.Skip message logged)"
              skipline[skip] = "SKIP " name " -- reason: " why
            }
            /^(ok|FAIL)[ \t]/ { pkg = $2; for (i = lastskip + 1; i <= skip; i++) skipline[i] = skipline[i] " [" pkg "]"; lastskip = skip; delete reason }
            END {
              print "==== per-package results ===="
              for (i = 1; i <= np; i++) print pkgline[i]
              print "==== skipped tests and reasons ===="
              for (i = 1; i <= skip; i++) print skipline[i]
              print "==== go test summary ===="
              printf "packages ok: %d, packages FAIL: %d\n", pok, pfail
              printf "tests passed: %d, failed: %d, skipped: %d\n", pass, fail, skip
            }
          ' "$RUNNER_TEMP/go-test.log"
